name: Bug report
description: Report incorrect behavior in the Praxis backend
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please confirm it's reproducible against `main`.
        **Do not include secrets, real `GOV_API_KEY` values, or private keys.**
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include the exact request (method, path, body) where relevant.
      placeholder: |
        1. POST /registry/listings with ...
        2. POST /registry/query with ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: spec-section
    attributes:
      label: Relevant spec section
      description: If the behavior contradicts the spec, cite it (e.g. "outline.md §9.5").
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, pnpm version, `PERSISTENCE` value, OS, commit SHA.
      placeholder: |
        node: 22.x
        pnpm: 11.x
        PERSISTENCE: memory
        commit: abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant logs or stack traces. Redact secrets.
      render: shell
